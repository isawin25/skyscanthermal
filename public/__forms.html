<!DOCTYPE html>
<html>
  <head>
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- Static form definition so Netlify's build-time form detection registers the contact form. -->
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="text" name="location" />
      <input type="text" name="contactMethod" />
      <textarea name="message"></textarea>
      <input type="text" name="preferredDate" />
      <input type="text" name="preferredTime" />
      <textarea name="additional"></textarea>
      <input type="file" name="photos" />
      <input type="file" name="thermal" />
      <input type="text" name="company" />
    </form>
  </body>
</html>
